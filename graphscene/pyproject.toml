[project]
name = "graphscene"
version = "0.1.0"
description = "A generic flow-graph navigation library."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphscene"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -rs"
